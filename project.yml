name: Aide

# XcodeGen spec — THIS file is the source of truth and is committed.
# The generated Aide.xcodeproj is gitignored; run `xcodegen generate` after edits.
# (Locked decision #3: XcodeGen + local SwiftPM modules.)

options:
  bundleIdPrefix: com.aide
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  AideModules:
    path: .

targets:
  Aide:
    type: application
    platform: macOS
    sources:
      - path: App
      # P2b Phase 1 (docs/native-deps.md § llama-server (LLM Sidecar)): the pinned,
      # checksum-verified llama-server executable + its sibling dylibs (fetched by
      # `just vendor-llama-server`, gitignored — Vendor/README.md). Bundled as a raw
      # folder reference via a dedicated Copy Files phase (destination: Resources), NOT
      # a SwiftPM `.binaryTarget` like whisper's xcframework — llama-server is a
      # spawnable executable, not a linkable library, so SwiftPM's binaryTarget
      # mechanism (which links, not embeds-a-raw-executable) doesn't apply. Lands at
      # Contents/Resources/llama-server/ in the built app, resolved at runtime via
      # `Bundle.main.resourceURL` (App/LlamaServerProcessSource.swift).
      - path: Vendor/bin/llama-server
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
    dependencies:
      - package: AideModules
        product: AideCore
      - package: AideModules
        product: AppLifecycle
      - package: AideModules
        product: DangerousCommandScanner
      - package: AideModules
        product: Persistence
      - package: AideModules
        product: Configuration
      - package: AideModules
        product: Overlay
      # P7: prompt-free permission detection + graceful-degradation map (docs/05-lld.md §8).
      - package: AideModules
        product: Permissions
      # P5: pure hotkey binding logic behind App/HotkeyManager.swift.
      - package: AideModules
        product: Hotkeys
      # P6: the marquee hotkey → Overlay → mock-driver loop (the VoiceSessionDriver seam).
      - package: AideModules
        product: VoiceSession
      # P10: the first-run onboarding flow coordinator (welcome → tier → permissions
      # → disclosure → hotkeys → guided first success → summary).
      - package: AideModules
        product: Onboarding
      # P2a: the pure STT heart (value types + STTEngine seam + mock).
      - package: AideModules
        product: SpeechToText
      # P2a: the app-linked native shell — the whisper.cpp C-bridge engine. Depending on
      # it mirrors the pinned whisper xcframework (a SwiftPM binaryTarget) into the app,
      # so it links/embeds in Aide.app (docs/native-deps.md).
      - package: AideModules
        product: WhisperSTTEngine
      # P2a Phase 3: the real VoiceSessionDriver conformer (capture → decode → Pre-Gate),
      # swapped in for MockVoiceSessionDriver. The App layer injects the concrete
      # WhisperSTTEngine + AudioCapture (App/AudioCapture.swift) into it.
      - package: AideModules
        product: STTVoiceSession
      # P2a/P2b Phase 5: the shared, pure model-provisioning core (descriptor,
      # verification, resume math, download-state codec, models directory, the
      # ModelProvisioner orchestrator) — the App layer resolves paths/descriptors
      # through it directly (AppCoordinator+ModelProvisioning.swift).
      - package: AideModules
        product: ModelProvisioning
      # P2a/P2b Phase 5: the resumable ranged-HTTP-GET shell — the one allowed
      # network egress. Real conformer of ModelProvisioning.ModelDownloading.
      - package: AideModules
        product: ModelDownloader
      # P2b Phase 2/3: the LLM-runtime pure heart — `SidecarController`/`SidecarState`,
      # the backoff schedule, the tested `SidecarLifecycleController` engine that
      # App/SidecarManager.swift configures with the real llama-server process source,
      # and (Phase 3) the `LLMClient` protocol + wire types + `MockLLMClient`.
      - package: AideModules
        product: LLMRuntime
      # P2b Phase 3: the real `LLMClient` conformer — a `URLSession`-based OpenAI-
      # compatible HTTP client, targeting the Sidecar's `LLMEndpoint` once `.ready`.
      - package: AideModules
        product: InferenceClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aide.Aide
        PRODUCT_NAME: Aide
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Menubar-only: no Dock icon.
        INFOPLIST_KEY_LSUIElement: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Aide transcribes your voice locally on this Mac. Audio never leaves the machine."
        # Required before the listen-only CGEventTap (Push-to-Talk) can capture the hotkey.
        INFOPLIST_KEY_NSInputMonitoringUsageDescription: "Aide listens for your push-to-talk hotkey so you can talk to it from any app. This stays on your Mac."
        # Required before EventKit's full-access request can run (the optional Calendar skill).
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Aide reads your calendar only to answer your schedule questions. This stays on your Mac."
        # Link the app code directly into the main executable instead of Xcode's separate
        # `Aide.debug.dylib`. The debug-dylib layout runs the real code from a nested dylib
        # whose code identity churns on every rebuild, which destabilizes TCC permission
        # grants (Input Monitoring / Accessibility) — the app has to be re-granted after each
        # build. A single self-contained binary keeps a stable identity so grants persist.
        ENABLE_DEBUG_DYLIB: NO
        # Signing / notarization posture (locked decision #2): hardened runtime ON from day one.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/Aide.entitlements
        # DEVELOPMENT_TEAM is intentionally unset — set your Team in Xcode once enrolled.
